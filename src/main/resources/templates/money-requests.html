<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Money Requests - ASWallet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="body-wallet body-money-requests body-money-requests-gold-panel">
<div class="home-bg-media" aria-hidden="true">
    <img class="home-bg-image" th:src="@{/images/transactions-requests.png}" alt="">
    <div class="home-bg-overlay"></div>
</div>

<main class="wallet-landing reveal-item">
    <section class="wallet-panel wallet-panel--money-requests wallet-panel--materialize reveal-child">
        <div class="form-panel-top form-panel-top--split auth-stagger">
            <a class="home-pill form-pill-link" th:href="@{/wallet}">Back to wallet</a>
            <form th:action="@{/transactions/requests/clear}"
                  method="post"
                  class="money-requests-clear-form"
                  onsubmit="return confirm('Delete all your money requests (incoming and sent)? This cannot be undone.');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="home-pill risk-reviews-clear-btn money-requests-clear-btn">Delete All</button>
            </form>
        </div>

        <h2 class="wallet-title wallet-title--center auth-stagger">Money Requests</h2>
        <p class="wallet-form-hint auth-stagger">
            Ask another user to send money to your wallet. They can accept or decline.
            Signed in as <span class="wallet-username" th:text="${currentUsername}"></span>.
        </p>

        <div class="success auth-stagger" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="error auth-stagger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <div class="money-request-master-detail auth-stagger">
            <div class="money-request-create-col">
                <h3 class="money-request-section__title">New request</h3>

                <form id="money-request-create-form"
                      class="auth-form money-request-create-form"
                      th:action="@{/transactions/requests}"
                      th:object="${moneyRequestCreateDTO}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="auth-field-group">
                        <label for="payerUsername">Request from (username)</label>
                        <input id="payerUsername" type="text" th:field="*{payerUsername}" placeholder="e.g. john_doe" required>
                        <div class="error" th:if="${#fields.hasErrors('payerUsername')}" th:errors="*{payerUsername}"></div>
                    </div>

                    <div class="auth-field-group">
                        <label for="amount">Amount</label>
                        <input id="amount" type="number" step="0.01" min="0.01" max="999999.99" th:field="*{amount}" placeholder="0.00" required>
                        <div class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                    </div>

                    <div class="auth-field-group" th:replace="~{fragments/spending-category-field :: field(false)}"></div>

                    <div class="auth-field-group">
                        <label for="note">Note (optional)</label>
                        <input id="note" type="text" th:field="*{note}" maxlength="200" placeholder="What is this for?">
                        <div class="error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
                    </div>
                </form>
            </div>

            <div class="money-request-lists-col">
                <section class="money-request-section money-request-section--incoming">
                    <h3 class="money-request-section__title">Incoming</h3>
                    <div class="money-request-list money-request-list--incoming" th:if="${!#lists.isEmpty(incomingRequests)}">
                        <article class="money-request-card"
                                 th:each="item : ${incomingRequests}"
                                 th:classappend="${item.status == 'PENDING'} ? ' money-request-card--pending' : ''">
                            <div class="money-request-card__top">
                                <span class="money-request-card__route"
                                      th:text="|From ${item.requesterUsername}|"></span>
                                <span class="money-request-status"
                                      th:classappend="| money-request-status--${#strings.toLowerCase(item.status)}|"
                                      th:text="${item.status}"></span>
                            </div>
                            <p class="money-request-card__amount"
                               th:text="|€${#numbers.formatDecimal(item.amount, 1, 2)}|"></p>
                            <p class="money-request-card__meta"
                               th:text="|${item.spendingCategory} · ${item.createdAt}|"></p>
                            <p class="money-request-card__note"
                               th:if="${item.note != null and !#strings.isEmpty(item.note)}"
                               th:text="${item.note}"></p>
                        </article>
                    </div>
                    <p class="tx-empty" th:if="${#lists.isEmpty(incomingRequests)}">No incoming requests.</p>
                </section>

                <section class="money-request-section money-request-section--outgoing">
                    <h3 class="money-request-section__title">Sent by me</h3>
                    <div class="money-request-list money-request-list--outgoing" th:if="${!#lists.isEmpty(outgoingRequests)}">
                        <article class="money-request-card"
                                 th:each="item : ${outgoingRequests}"
                                 th:classappend="${item.status == 'PENDING'} ? ' money-request-card--pending' : ''">
                            <div class="money-request-card__top">
                                <span class="money-request-card__route"
                                      th:text="|To ${item.payerUsername}|"></span>
                                <span class="money-request-status"
                                      th:classappend="| money-request-status--${#strings.toLowerCase(item.status)}|"
                                      th:text="${item.status}"></span>
                            </div>
                            <p class="money-request-card__amount"
                               th:text="|€${#numbers.formatDecimal(item.amount, 1, 2)}|"></p>
                            <p class="money-request-card__meta"
                               th:text="|${item.spendingCategory} · ${item.createdAt}|"></p>
                            <p class="money-request-card__note"
                               th:if="${item.note != null and !#strings.isEmpty(item.note)}"
                               th:text="${item.note}"></p>
                        </article>
                    </div>
                    <p class="tx-empty money-request-empty" th:if="${#lists.isEmpty(outgoingRequests)}">No requests sent yet.</p>
                </section>
            </div>

            <div class="money-request-submit-col">
                <button type="submit"
                        form="money-request-create-form"
                        class="auth-submit money-request-send-btn">Send Request</button>
            </div>

            <div class="money-request-respond-col">
                <th:block th:each="item : ${incomingRequests}">
                    <div class="money-request-respond-bar" th:if="${item.canRespond}">
                        <form th:action="@{/transactions/requests/{id}/accept(id=${item.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="wallet-btn money-request-btn--accept">Accept</button>
                        </form>
                        <form class="money-request-card__actions-end"
                              th:action="@{/transactions/requests/{id}/decline(id=${item.id})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="wallet-btn wallet-btn-danger">Decline</button>
                        </form>
                    </div>
                </th:block>

                <th:block th:each="item : ${outgoingRequests}">
                    <div class="money-request-respond-bar money-request-respond-bar--cancel" th:if="${item.canCancel}">
                        <form class="money-request-card__actions-end"
                              th:action="@{/transactions/requests/{id}/cancel(id=${item.id})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="wallet-btn wallet-btn-danger">Cancel</button>
                        </form>
                    </div>
                </th:block>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/app-footer :: footer}"></footer>
<script th:src="@{/js/home.js}"></script>
<script th:src="@{/js/transaction-amount-step.js}"></script>
</body>
</html>
