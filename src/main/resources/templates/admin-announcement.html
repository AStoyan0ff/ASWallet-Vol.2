<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>System Announcement - ASWallet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="body-wallet body-admin-announcement body-admin-announcement-gold-panel">
<div class="home-bg-media" aria-hidden="true">
    <img class="home-bg-image" th:src="@{/images/reports.png}" alt="">
    <div class="home-bg-overlay"></div>
</div>

<main class="wallet-landing reveal-item">
    <section class="wallet-panel wallet-panel--form admin-announcement-panel wallet-panel--materialize reveal-child">
        <div class="form-panel-top form-panel-top--split auth-stagger">
            <a class="home-pill form-pill-link" th:href="@{/wallet}">Back to wallet</a>

            <form th:if="${latestAnnouncement != null}"
                  class="tx-clear-history-form"
                  th:action="@{/admin/announcement/clear}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to clear all announcement records? This cannot be undone.');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="home-pill tx-clear-history-btn">Clear</button>
            </form>
        </div>

        <header class="admin-announcement-header auth-stagger">
            <h2 class="wallet-title wallet-title--center">Announcement</h2>
            <p class="wallet-form-hint">
                Publish a header banner on Wallet for regular users.
                Signed in as <span class="wallet-username" th:text="${currentUsername}"></span>.
            </p>
        </header>

        <div class="success auth-stagger" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="error auth-stagger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <div class="admin-announcement-status auth-stagger"
             th:if="${latestAnnouncement != null}"
             th:classappend="${latestAnnouncement.active} ? ' is-active' : ' is-off'">

            <span class="admin-announcement-status__label"
                  th:text="${latestAnnouncement.active} ? 'Status: ON' : 'Status: OFF'">Status
            </span>
            <span class="admin-announcement-status__meta"
                  th:text="|Updated by ${latestAnnouncement.updatedByUsername}|">Updated by
            </span>
        </div>
        <p class="admin-announcement-empty auth-stagger" th:if="${latestAnnouncement == null}">
            No announcement yet. Write a message and publish.
        </p>

        <form class="auth-form admin-announcement-form auth-stagger"
              th:action="@{/admin/announcement/publish}"
              th:object="${announcementForm}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="auth-field-group">
                <label for="announcementMessage">Message</label>
                <textarea id="announcementMessage"
                          th:field="*{message}"
                          rows="3"
                          maxlength="500"
                          placeholder="e.g. Maintenance tonight 23:00-01:00"
                          required></textarea>
                <div class="error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
            </div>

            <div class="admin-announcement-actions">
                <button type="submit" class="wallet-btn admin-action-btn admin-action-btn--update">Publish</button>
            </div>
        </form>

        <form class="admin-announcement-off-form auth-stagger"
              th:if="${latestAnnouncement != null and latestAnnouncement.active}"
              th:action="@{/admin/announcement/deactivate}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="wallet-btn wallet-btn-danger">Turn off</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/app-footer :: footer}"></footer>
<script th:src="@{/js/home.js}"></script>
</body>
</html>
